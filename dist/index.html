 appli reste ouverte. Les moments \xAB apr\xE8s le repas \xBB n'ont pas d'heure fixe, mais tu recevras quand m\xEAme un rappel d\xE8s la fin de cette p\xE9riode de la journ\xE9e si ce n'est pas encore coch\xE9.",es:"Los recordatorios solo funcionan mientras esta app permanece abierta. Los momentos \xABdespu\xE9s de la comida\xBB no tienen hora fija, pero aun as\xED recibir\xE1s un recordatorio cuando termine esa franja del d\xEDa si todav\xEDa no lo has marcado.",tr:'Hat\u0131rlatmalar yaln\u0131zca bu uygulama a\xE7\u0131k kald\u0131\u011F\u0131 s\xFCrece \xE7al\u0131\u015F\u0131r. "Yemekten sonra" anlar\u0131n\u0131n sabit bir saati yoktur, ancak hen\xFCz i\u015Faretlenmediyse o g\xFCn diliminin sonunda yine de bir hat\u0131rlatma al\u0131rs\u0131n.',ar:'\u062A\u0639\u0645\u0644 \u0627\u0644\u062A\u0630\u0643\u064A\u0631\u0627\u062A \u0641\u0642\u0637 \u0623\u062B\u0646\u0627\u0621 \u0628\u0642\u0627\u0621 \u0647\u0630\u0627 \u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u0645\u0641\u062A\u0648\u062D\u064B\u0627. \u0644\u062D\u0638\u0627\u062A "\u0628\u0639\u062F \u0627\u0644\u0648\u062C\u0628\u0629" \u0644\u064A\u0633 \u0644\u0647\u0627 \u0648\u0642\u062A \u062B\u0627\u0628\u062A\u060C \u0644\u0643\u0646\u0643 \u0633\u062A\u062A\u0644\u0642\u0649 \u062A\u0630\u0643\u064A\u0631\u064B\u0627 \u0628\u0645\u062C\u0631\u062F \u0627\u0646\u062A\u0647\u0627\u0621 \u0630\u0644\u0643 \u0627\u0644\u062C\u0632\u0621 \u0645\u0646 \u0627\u0644\u064A\u0648\u0645 \u0625\u0630\u0627 \u0644\u0645 \u064A\u062A\u0645 \u062A\u0633\u062C\u064A\u0644\u0647\u0627 \u0628\u0639\u062F.'},settings_home_title:{nl:"Beginscherm",en:"Home screen",de:"Startbildschirm",fr:"\xC9cran d'accueil",es:"Pantalla de inicio",tr:"Ana ekran",ar:"\u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629"},settings_home_headline:{nl:"Zet MedBox op je beginscherm",en:"Add MedBox to your home screen",de:"MedBox zum Startbildschirm hinzuf\xFCgen",fr:"Ajouter MedBox \xE0 ton \xE9cran d'ac
